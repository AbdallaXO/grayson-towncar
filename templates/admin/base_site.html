<!-- yourapp/templates/admin/base_site.html -->
{% extends 'admin/base_site.html' %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    :root {
      --primary: #2b6a94;
      --secondary: #5296c2;
      --accent: #216384;
      --primary-fg: #fff;
    }
    
    /* Table styling */
    #changelist table thead th {
      background: var(--primary);
      color: var(--primary-fg);
    }
    
    .form-row {
      padding: 1em;
      border-bottom: 1px solid #eee;
    }
    
    /* Improve inline edit look */
    .vIntegerField,
    .vDecimalField {
      width: 100px !important;
    }
    
    /* Action buttons */
    .button {
      background: var(--primary);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      text-decoration: none;
    }
    
    .button:hover {
      background: var(--accent);
    }
    
    /* Improve inlines */
    .inline-group {
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 1em 0;
    }
    
    .inline-group h2 {
      background: #f5f5f5;
      padding: 8px;
      margin: 0;
    }
  </style>
{% endblock %}

{% block title %}
  {{ title }} | Transportation Management System
{% endblock %}

{% block branding %}
  <h1 id="site-name"><a href="{% url 'admin:index' %}">Transportation Management System</a></h1>
{% endblock %}
