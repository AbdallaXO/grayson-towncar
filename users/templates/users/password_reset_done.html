<!-- users/templates/users/password_reset_complete.html -->
{% extends 'main.html' %}
{% load static %}

{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 text-center">
            <a href="{% url 'home' %}"></a>

            <div class="my-4">
              <div class="text-success mb-3">
                <i class="fas fa-check-circle fa-3x"></i>
              </div>
              <h3 class="text-dark mb-3">Password Reset Complete</h3>
              <p class="text-muted">Your password has been successfully reset. You can now log in with your new password.</p>
            </div>

            <div class="d-grid">
              <a href="{% url 'agent_login' %}" class="btn btn-dark btn-lg">Sign In Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}

{% block footer %}{% endblock %}
{% block newsletter %}{% endblock %}
