{% comment %}
  Show/hide for any password field on the auth pages. Each toggle carries
  data-pw-toggle="<id of the input>". Progressive enhancement: the buttons
  ship hidden and are only revealed here, so a visitor without JS never
  sees a control that does nothing.
{% endcomment %}
<script>
    (function() {
        var toggles = document.querySelectorAll('[data-pw-toggle]');
        Array.prototype.forEach.call(toggles, function(btn) {
            var input = document.getElementById(btn.getAttribute('data-pw-toggle'));
            if (!input) return;
            btn.hidden = false;
            btn.addEventListener('click', function() {
                var shown = input.type === 'text';
                input.type = shown ? 'password' : 'text';
                btn.setAttribute('aria-pressed', String(!shown));
                btn.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
                btn.querySelector('i').className = shown ? 'bi bi-eye' : 'bi bi-eye-slash';
                input.focus();
            });
        });
    })();
</script>
