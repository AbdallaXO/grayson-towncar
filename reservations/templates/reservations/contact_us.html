{% extends 'main.html' %}
{% load static %}
{% block content %}

<!-- Contact Section -->
<section class="contact-section py-5" style="background-color: #f9f9f9;">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center mb-5">
                <h1 class="display-4" style="font-family: 'Montserrat', var(--bs-body-font-family);">Contact Us</h1>
                <p class="lead text-muted">We're here to help you plan your perfect journey</p>
            </div>
        </div>

        <div class="row">
            <!-- Contact Information -->
            <div class="col-lg-5 mb-5 mb-lg-0">
                <div class="card border-0 shadow-sm h-100" style="background-color: #f8f9fa; background-image: linear-gradient(to bottom, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0) 100%);">
                    <div class="card-body p-5">
                        <h3 class="h4 mb-4">Get in Touch</h3>
                        
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-square bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 40px; height: 40px; min-width: 40px;">
                                <i class="bi bi-telephone-fill"></i>
                            </div>
                            <div>
                                <h5 class="mb-0">Phone</h5>
                                <p class="mb-0">(xxx) xxx-xxxx</p>
                            </div>
                        </div>
                        
                        <div class="d-flex align-items-center mb-4">
                            <div class="icon-square bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 40px; height: 40px; min-width: 40px;">
                                <i class="bi bi-envelope-fill"></i>
                            </div>
                            <div>
                                <h5 class="mb-0">Email</h5>
                                <p class="mb-0">contact@graysontowncar.com</p>
                            </div>
                        </div>
                        <h4 class="h5 mt-5 mb-3">Follow Our Socials</h4>
                        <div class="social-links">
                            <a href="https://www.facebook.com/profile.php?id=61574468855996" target="_blank" class="me-3 text-decoration-none">
                                <i class="bi bi-facebook fs-4"></i>
                            </a>
                            <a href="https://www.instagram.com/graysontowncar" target="_blank" class="me-3 text-decoration-none">
                                <i class="bi bi-instagram fs-4"></i>
                            </a>
                            <a href="https://x.com/GraysonTowncar" target="_blank" class="me-3 text-decoration-none">
                                <i class="bi bi-twitter fs-4"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Quote Request Form -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm" style="background-color: #f8f9fa; background-image: linear-gradient(to bottom, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0) 100%);">
                    <div class="card-body p-5">
                        <h3 class="h4 mb-4">Request a Personalized Quote</h3>
                        <form id="quoteForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Preferred Method of Communication</label>
                                <div class="d-flex flex-wrap">
                                    <div class="form-check me-4">
                                        <input class="form-check-input" type="radio" name="preferredContact" id="preferPhone">
                                        <label class="form-check-label" for="preferPhone">Phone Call</label>
                                    </div>
                                    <div class="form-check me-4">
                                        <input class="form-check-input" type="radio" name="preferredContact" id="preferText">
                                        <label class="form-check-label" for="preferText">Text Message</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="preferredContact" id="preferEmail">
                                        <label class="form-check-label" for="preferEmail">Email</label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="tripDetails" class="form-label d-flex align-items-center">
                                    About Your Trip
                                    <button type="button" class="btn btn-sm ms-2 p-0" data-bs-toggle="tooltip" data-bs-placement="top" title="Please provide details about your desired trip so we can create a personalized quote. We'll get back to you shortly.">
                                        <i class="bi bi-info-circle text-primary"></i>
                                    </button>
                                </label>
                                <textarea class="form-control" id="tripDetails" rows="5" placeholder="Tell us about your dream destination, travel dates, number of travelers, and any special requirements..."></textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg d-block mx-auto">Request Quote</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- CSS for Bootstrap Icons and Montserrat font (add this to your head section or include the CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">

<!-- Optional JavaScript -->
<script>
    // Initialize tooltips
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });

    // Simple form validation
    document.getElementById('quoteForm').addEventListener('submit', function(event) {
        event.preventDefault();
        // You can add AJAX submission here
        alert('Your quote request has been submitted! We will contact you shortly.');
        this.reset();
    });
</script>

{% endblock %}
