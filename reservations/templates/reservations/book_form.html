{% extends 'main.html' %}
{% load static %}

{% block content %}
  <div class="container my-5">
    <h2 class="mb-4">Book Your Ride</h2>

    <p>
      <strong>Vehicle:</strong> {{ vehicle.get_vehicle_type_display }}
    </p>
    <p>
      <strong>Route:</strong> {{ route.name }}
    </p>
    <p>
      <strong>Trip Type:</strong> {{ trip_type|capfirst }}
    </p>
    <p>
      <strong>Base Price:</strong> ${{ base_price }}
    </p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Continue to Payment</button>
    </form>
  </div>
{% endblock %}
