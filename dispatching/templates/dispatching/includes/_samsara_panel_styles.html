{% comment %}One-time styles + font for the Samsara live-tracking panel. Include
once per page (inside {% block extra_css %}).{% endcomment %}
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Samsara live-tracking panel — compact parchment chip, Montserrat, colored
     left edge. Palette aligned with the admin tooling (amber #e0a300, red #c0392b). */
  .stp {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin-top: 6px;
    padding: 5px 9px 5px 9px;
    border-radius: 7px;
    border-left: 3px solid transparent;
    background: #f6f1e7;                 /* parchment */
    max-width: 248px;
  }
  .stp-top { display: flex; align-items: center; gap: 5px; margin-bottom: 1px; }
  .stp-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #9aa0a6; flex: 0 0 auto;
    animation: stp-pulse 1.6s ease-in-out infinite;
  }
  .stp-pill {
    font-size: 8.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: #6b675e;
  }
  /* Moving / Stopped chip — always visible so a parked car is obvious at a glance. */
  .stp-motion {
    font-size: 8px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; flex: 0 0 auto; white-space: nowrap;
  }
  .stp-motion-on  { color: #1b6e3f; background: #e2f2e8; }
  .stp-motion-off { color: #8a4a00; background: #f3e3cd; }
  .stp-veh {
    margin-left: auto; flex: 0 0 auto;
    font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #3f3b32;
  }
  .stp-headline { font-size: 12px; font-weight: 700; color: #2d2a24; line-height: 1.15; }
  /* Wall-clock line: when the car arrives vs when the pickup is. */
  .stp-times { font-size: 11px; font-weight: 600; color: #4a463d; margin-top: 2px; line-height: 1.25; }
  .stp-times .stp-mins { color: #8a857a; font-weight: 500; }
  .stp-times .stp-target { color: #6b675e; font-weight: 500; }
  .stp-evidence { font-size: 10px; font-weight: 500; color: #8a857a; margin-top: 1px; line-height: 1.2; }
  @keyframes stp-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.8); }
  }

  /* At risk — red */
  .stp-at_risk { border-left-color: #c0392b; background: #f7ece3; }
  .stp-at_risk .stp-dot { background: #c0392b; }
  .stp-at_risk .stp-pill { color: #a5331f; }
  .stp-at_risk .stp-veh { color: #a5331f; }
  .stp-at_risk .stp-headline { color: #9b2c1a; }

  /* Tight — amber */
  .stp-tight { border-left-color: #e0a300; background: #f8f1df; }
  .stp-tight .stp-dot { background: #e0a300; }
  .stp-tight .stp-pill { color: #9a6b00; }
  .stp-tight .stp-veh { color: #9a6b00; }
  .stp-tight .stp-headline { color: #7a5600; }

  /* On track — calm: light fill, green pulse, full info still readable */
  .stp-on_track { background: #f2f5f0; border-left-color: #2e9e5b; }
  .stp-on_track .stp-dot { background: #2e9e5b; }
  .stp-on_track .stp-pill { color: #2e7d4f; }

  /* No signal — grey: vehicle mapped to Samsara but no usable GPS/ETA */
  .stp-no_signal { background: #f1f1ef; border-left-color: #9aa0a6; }
  .stp-no_signal .stp-dot { background: #9aa0a6; animation: none; }
  .stp-no_signal .stp-pill { color: #6b675e; }
  .stp-no_signal .stp-headline { color: #5d594f; font-weight: 600; }
</style>
