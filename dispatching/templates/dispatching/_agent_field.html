{# One field in the agent profile editor. `check` renders a checkbox row; `wide` spans both columns. #}
{% if check %}
<label class="ap-check{% if field.errors %} has-error{% endif %}" for="{{ field.id_for_label }}">
  {{ field }}
  <span>
    <strong>{{ field.label }}</strong>
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<em class="ap-error">{{ error }}</em>{% endfor %}
  </span>
</label>
{% else %}
<div class="ap-field{% if wide %} wide{% endif %}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<div class="ap-error">{{ error }}</div>{% endfor %}
</div>
{% endif %}
