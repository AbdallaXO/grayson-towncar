{% comment %}
Shared CSS partial for the Travel Agent / Agency admin pages.
Visual language matches affiliate_payments.html.
{% endcomment %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --gt-gold: #C9A227;
  --gt-gold-soft: rgba(201,162,39,0.12);
  --gt-dark: #1a1d21;
  --gt-dark-2: #23272b;
  --gt-surface: #f7f8fa;
  --gt-border: #e2e5ea;
  --gt-red: #e74c3c;
  --gt-green: #27ae60;
  --gt-blue: #3498db;
  --gt-text: #2c3e50;
  --gt-muted: #7f8c9b;
  --gt-radius: 10px;
}
.tap-wrap { font-family: 'DM Sans', sans-serif; color: var(--gt-text); }

.tap-page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem; margin-bottom: 1.4rem;
}
.tap-title { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; color: var(--gt-dark); margin: 0; }
.tap-subtitle { font-size: .85rem; color: var(--gt-muted); font-weight: 400; margin-top: .15rem; }
.tap-tab-row { display: flex; gap: .35rem; }
.tap-tab {
  background: #fff; border: 1px solid var(--gt-border); color: var(--gt-text);
  padding: .5rem .95rem; border-radius: 6px;
  font-size: .82rem; font-weight: 600; text-decoration: none;
  display: inline-flex; align-items: center; gap: .35rem;
}
.tap-tab:hover { background: var(--gt-surface); color: var(--gt-text); }
.tap-tab.active { background: var(--gt-dark); border-color: var(--gt-dark); color: #fff; }
.tap-tab i { font-size: .9rem; }

/* Summary tiles */
.tap-summary {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;
}
@media (max-width: 768px) {
  .tap-summary { grid-template-columns: repeat(2, 1fr); }
}
.tap-stat-card {
  background: var(--gt-dark); color: #fff; border-radius: var(--gt-radius);
  padding: 18px 16px; position: relative; overflow: hidden;
}
.tap-stat-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gt-gold), transparent);
}
.tap-stat-label {
  font-size: .68rem; text-transform: uppercase; letter-spacing: 1px;
  color: rgba(255,255,255,0.55); margin-bottom: 6px; font-weight: 500;
}
.tap-stat-value {
  font-family: 'JetBrains Mono', monospace; font-size: 1.45rem; font-weight: 500;
}
.tap-stat-value.gold { color: var(--gt-gold); }
.tap-stat-value.red  { color: #ff6b6b; }

/* Filter bar */
.tap-filter {
  background: #fff; border: 1px solid var(--gt-border); border-radius: var(--gt-radius);
  padding: 10px 14px; margin-bottom: 22px;
}
.tap-filter .form-control,
.tap-filter .form-select {
  border-color: var(--gt-border); font-size: .82rem; border-radius: 6px;
}
.tap-filter .form-control:focus,
.tap-filter .form-select:focus {
  border-color: var(--gt-gold); box-shadow: 0 0 0 2px var(--gt-gold-soft);
}
.tap-filter .btn-dark {
  background: var(--gt-dark); border-color: var(--gt-dark); border-radius: 6px;
}

/* Table */
.tap-table-wrap {
  background: #fff; border: 1px solid var(--gt-border); border-radius: var(--gt-radius);
  overflow: hidden;
}
.tap-table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 0; }
.tap-table thead th {
  background: var(--gt-surface);
  font-size: .68rem; text-transform: uppercase; letter-spacing: .8px;
  color: var(--gt-muted); font-weight: 700;
  padding: .7rem .9rem; border-bottom: 1px solid var(--gt-border);
  white-space: nowrap;
}
.tap-table tbody td {
  padding: .85rem .9rem; border-bottom: 1px solid var(--gt-border);
  font-size: .85rem; vertical-align: middle;
}
.tap-table tbody tr:last-child td { border-bottom: none; }
.tap-table tbody tr:hover { background: var(--gt-surface); }
.tap-table a.row-link { color: inherit; text-decoration: none; }
.tap-table a.row-link:hover { color: var(--gt-gold); }

.tap-name { font-weight: 700; color: var(--gt-dark); font-size: .92rem; }
.tap-sub  { font-size: .75rem; color: var(--gt-muted); }

.tap-pill {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .2rem .55rem; border-radius: 20px;
  font-size: .68rem; font-weight: 700; letter-spacing: .3px;
}
.tap-pill-active   { background: rgba(39,174,96,.12);  color: var(--gt-green); }
.tap-pill-inactive { background: rgba(231,76,60,.10);  color: var(--gt-red); }
.tap-pill-warn     { background: rgba(201,162,39,.14); color: var(--gt-gold); }
.tap-pill-info     { background: rgba(52,152,219,.12); color: var(--gt-blue); }
.tap-pill-muted    { background: var(--gt-surface);    color: var(--gt-muted); }

.tap-money {
  font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: .9rem;
}
.tap-money.red   { color: var(--gt-red); }
.tap-money.green { color: var(--gt-green); }

.tap-empty {
  text-align: center; padding: 60px 20px; color: var(--gt-muted);
}
.tap-empty i { font-size: 2.4rem; opacity: .35; display: block; margin-bottom: .6rem; }

/* Detail page panels */
.tap-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
@media (max-width: 992px) { .tap-grid-2 { grid-template-columns: 1fr; } }

.tap-panel {
  background: #fff; border: 1px solid var(--gt-border); border-radius: var(--gt-radius);
  margin-bottom: 18px; overflow: hidden;
}
.tap-panel-head {
  padding: 14px 18px; border-bottom: 1px solid var(--gt-border);
  display: flex; align-items: center; gap: .55rem;
  background: var(--gt-surface);
}
.tap-panel-head h6 {
  margin: 0; font-size: .8rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; color: var(--gt-dark);
}
.tap-panel-head i { color: var(--gt-gold); font-size: 1rem; }
.tap-panel-head .spacer { flex: 1; }
.tap-panel-body { padding: 18px; }

.tap-detail-row {
  display: flex; gap: .8rem; padding: .55rem 0;
  border-bottom: 1px dashed var(--gt-border);
  font-size: .85rem;
}
.tap-detail-row:last-child { border-bottom: none; }
.tap-detail-label {
  width: 130px; flex-shrink: 0;
  font-size: .7rem; text-transform: uppercase; letter-spacing: .6px;
  color: var(--gt-muted); font-weight: 600; padding-top: .15rem;
}
.tap-detail-value { color: var(--gt-text); flex: 1; }
.tap-detail-value.empty { color: var(--gt-muted); font-style: italic; }

.tap-mini-stats {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  margin-bottom: 14px;
}
.tap-mini-stat {
  background: var(--gt-surface); border: 1px solid var(--gt-border);
  border-radius: 8px; padding: 12px;
}
.tap-mini-stat-label {
  font-size: .65rem; text-transform: uppercase; letter-spacing: .6px;
  color: var(--gt-muted); font-weight: 600;
}
.tap-mini-stat-value {
  font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
  font-weight: 600; color: var(--gt-dark); margin-top: .25rem;
}
.tap-mini-stat-value.red { color: var(--gt-red); }
.tap-mini-stat-value.green { color: var(--gt-green); }

.tap-action-btn {
  background: var(--gt-dark); color: #fff; border: none;
  padding: .55rem 1rem; border-radius: 6px;
  font-size: .82rem; font-weight: 600;
  display: inline-flex; align-items: center; gap: .4rem;
  text-decoration: none;
}
.tap-action-btn:hover { background: var(--gt-dark-2); color: #fff; }
.tap-action-btn.gold { background: var(--gt-gold); color: #1a1d21; }
.tap-action-btn.gold:hover { background: #b08c1c; color: #1a1d21; }
.tap-action-btn.outline {
  background: #fff; color: var(--gt-text); border: 1px solid var(--gt-border);
}
.tap-action-btn.outline:hover { background: var(--gt-surface); color: var(--gt-dark); }

.tap-back-link {
  font-size: .8rem; color: var(--gt-muted); text-decoration: none;
  display: inline-flex; align-items: center; gap: .3rem; margin-bottom: .5rem;
}
.tap-back-link:hover { color: var(--gt-dark); }

/* ─────────────────────────────────────────────────────────
   Inline-edit table (Travel Agents directory)
   ───────────────────────────────────────────────────────── */
.tap-table-edit thead th { padding: .65rem .7rem; }
.tap-table-edit tbody td { padding: .55rem .7rem; vertical-align: middle; }
.tap-cell-check { width: 36px; padding-right: 0 !important; }
.tap-col-agency  { min-width: 200px; max-width: 240px; }
.tap-col-pays    { width: 86px; }
.tap-col-pmethod { min-width: 220px; }
.tap-col-rate    { width: 90px; white-space: nowrap; }

.tap-check {
  width: 16px; height: 16px; cursor: pointer; accent-color: var(--gt-gold);
}

.tap-inline-select {
  width: 100%; padding: .35rem .5rem;
  font-size: .82rem; color: var(--gt-text);
  background: #fff; border: 1px solid var(--gt-border); border-radius: 6px;
  transition: border-color .15s, box-shadow .15s, background .25s;
}
.tap-inline-select:hover { border-color: #c9cdd4; }
.tap-inline-select:focus {
  outline: none; border-color: var(--gt-gold);
  box-shadow: 0 0 0 2px var(--gt-gold-soft);
}
.tap-inline-select.saving { background: #fff8e1; }
.tap-inline-select.saved  {
  background: rgba(39,174,96,.12); border-color: var(--gt-green);
}

.tap-inline-rate {
  width: 64px; padding: .3rem .4rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: .85rem; text-align: right;
  border: 1px solid var(--gt-border); border-radius: 6px;
  background: #fff; color: var(--gt-text);
  transition: border-color .15s, box-shadow .15s, background .25s;
  -moz-appearance: textfield;
}
.tap-inline-rate::-webkit-outer-spin-button,
.tap-inline-rate::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.tap-inline-rate:hover { border-color: #c9cdd4; }
.tap-inline-rate:focus {
  outline: none; border-color: var(--gt-gold);
  box-shadow: 0 0 0 2px var(--gt-gold-soft);
}
.tap-inline-rate.saving { background: #fff8e1; }
.tap-inline-rate.saved {
  background: rgba(39,174,96,.12); border-color: var(--gt-green);
}
.tap-rate-unit { color: var(--gt-muted); font-size: .8rem; margin-left: 2px; }

/* iOS-style toggle for "Agency pays" */
.tap-toggle { display: inline-flex; cursor: pointer; user-select: none; }
.tap-toggle input { position: absolute; opacity: 0; pointer-events: none; }
.tap-toggle-track {
  width: 36px; height: 20px;
  background: #cfd3da; border-radius: 999px;
  position: relative; transition: background .15s;
  display: inline-block;
}
.tap-toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.18);
  transition: transform .18s ease;
}
.tap-toggle input:checked + .tap-toggle-track {
  background: var(--gt-green);
}
.tap-toggle input:checked + .tap-toggle-track .tap-toggle-thumb {
  transform: translateX(16px);
}
.tap-toggle input:disabled + .tap-toggle-track {
  background: #e8eaee; opacity: .55; cursor: not-allowed;
}
.tap-toggle input:focus-visible + .tap-toggle-track {
  box-shadow: 0 0 0 2px var(--gt-gold-soft);
}

/* Bulk action bar */
.tap-bulk-bar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  background: var(--gt-dark); color: #fff;
  border-radius: var(--gt-radius);
  padding: 10px 16px; margin-bottom: 14px;
  position: sticky; top: 8px; z-index: 5;
  box-shadow: 0 4px 18px rgba(26,29,33,.18);
}
.tap-bulk-bar[hidden] { display: none; }
.tap-bulk-left { font-size: .85rem; }
.tap-bulk-left strong { color: var(--gt-gold); font-size: 1rem; margin-right: 4px; }
.tap-bulk-clear {
  color: rgba(255,255,255,.7); text-decoration: underline;
  font-size: .78rem; margin-left: 10px;
}
.tap-bulk-clear:hover { color: #fff; }
.tap-bulk-actions { display: flex; align-items: center; gap: 8px; }
.tap-bulk-input {
  width: 240px; font-size: .82rem;
  background: #fff; color: var(--gt-text);
  border: 1px solid transparent; border-radius: 6px;
}

/* Toast */
.tap-toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--gt-dark); color: #fff;
  padding: 10px 16px; border-radius: 8px;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .85rem; font-weight: 500;
  box-shadow: 0 8px 28px rgba(26,29,33,.28);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
  z-index: 9999;
}
.tap-toast.show { opacity: 1; transform: translateY(0); }
.tap-toast i { color: var(--gt-green); font-size: 1rem; }
.tap-toast.error { background: #6b1a1a; }
.tap-toast.error i { color: #ffb3a7; }

/* Payment-info pill (mirrored from affiliate_payments.html) */
.payment-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: .7rem; font-weight: 700; letter-spacing: .2px; line-height: 1.4;
  flex-shrink: 0;
}
.payment-badge.venmo   { background: #e8f4fd; color: #006cc1; }
.payment-badge.zelle   { background: #f0e6ff; color: #5a25a3; }
.payment-badge.paypal  { background: #e8efff; color: #003087; }
.payment-badge.cashapp { background: #e1faea; color: #008f33; }
.payment-badge.bank    { background: #eff1f4; color: #2c3e50; }
.payment-badge.check   { background: #eef0f4; color: #555f6e; }
.payment-badge.other   { background: #eef0f4; color: #6b7280; }
.payment-badge.agency  { background: var(--gt-gold-soft); color: #8a6d10; }

.am-pay-row {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 6px;
  background: var(--gt-surface);
  border: 1px solid var(--gt-border);
  border-radius: 999px;
  max-width: 100%;
  user-select: none;
  transition: background .15s, border-color .15s, color .15s;
}
.am-pay-row--copyable { cursor: pointer; }
.am-pay-row--copyable:hover { background: #eef0f4; border-color: #c8ccd2; }
.am-pay-row.copied { background: #d4edda; border-color: #b1dfbb; }
.am-pay-row .payment-handle {
  font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  font-size: .8rem; font-weight: 500;
  color: var(--gt-text); letter-spacing: -.1px;
  word-break: break-all;
}
.am-pay-row .payment-handle--missing { font-style: italic; color: var(--gt-muted); font-weight: 400; }
.am-pay-row .payment-copy-icon { font-size: .85rem; color: var(--gt-muted); flex-shrink: 0; }
.am-pay-row--copyable:hover .payment-copy-icon { color: var(--gt-text); }
.am-pay-row.copied .payment-copy-icon { color: #1e7e34; }
</style>
