{% load static %}
<nav class="navbar navbar-expand-lg bg-navbar-dark sticky-top">
  <div class="container px-4 bg-navbar-dark">
    <a class="navbar-brand" href="{% url 'dashboard' %}"><span class="fs-3 fw-bold text-white"></i>Dispatching</span></a>
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#dispatchNavbar"
            aria-controls="dispatchNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
            style="filter: brightness(0) invert(1)">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="dispatchNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link text-white {% if request.resolver_match.url_name == 'dashboard' %}active fw-bold{% endif %}"
             href="{% url 'dashboard' %}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white {% if request.resolver_match.url_name == 'reservations_list' %}active fw-bold{% endif %}"
             href="{% url 'reservations_list' %}"><i class="bi bi-calendar2-check me-1"></i>Reservations</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white {% if request.resolver_match.url_name == 'legs_list' %}active fw-bold{% endif %}"
             href="{% url 'legs_list' %}"><i class="bi bi-signpost-split me-1"></i>All Legs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white {% if request.resolver_match.url_name == 'statistics_page' %}active fw-bold{% endif %}"
             href="{% url 'statistics_page' %}"><i class="bi bi-graph-up me-1"></i>Statistics</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-white"
             href="#"
             id="userDropdown"
             role="button"
             data-bs-toggle="dropdown"
             aria-expanded="false"><i class="bi bi-person-circle me-1"></i>{{ request.user|title }}</a>
          <ul class="dropdown-menu bg-light" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" href="{% url 'admin:index' %}" target="_blank"><i class="bi bi-gear me-2"></i>Admin</a>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'home' %}"><i class="bi bi-box-arrow-right me-2"></i>Main Website</a>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<style>
    /* Define the dark background for the navbar */
    .bg-navbar-dark {
        background-color: #212529;
    }

    /* Increase the size of navbar items */
    .navbar-nav .nav-link {
        font-size: 1.1rem;
        padding: 0.7rem 1rem;
    }

    /* Style for active nav item */
    .navbar-nav .nav-link.active {
        border-bottom: 2px solid #0d6efd;
    }

    /* Adjust the size of dropdown items */
    .dropdown-menu .dropdown-item {
        font-size: 1rem;
        padding: 0.6rem 1rem;
    }

    /* Add some spacing to the navbar */
    .navbar {
        margin-bottom: 1rem;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize all dropdowns
        var dropdownElementList = [].slice.call(document.querySelectorAll('.dropdown-toggle'));
        var dropdownList = dropdownElementList.map(function(dropdownToggleEl) {
            return new bootstrap.Dropdown(dropdownToggleEl);
        });

        // Initialize navbar collapse
        var navbarToggler = document.querySelector('.navbar-toggler');
        var navbarCollapse = document.querySelector('.navbar-collapse');

        if (navbarToggler && navbarCollapse) {
            navbarToggler.addEventListener('click', function() {
                navbarCollapse.classList.toggle('show');
            });
        }
    });
</script>
