{# One agent under an agency heading on the Agency links page. #}
{% load humanize %}
<label class="al-row" data-search="{{ p.agent.agent_name|default:p.agent.user.username|lower }} {{ p.typed|lower }} {{ p.agency.name|lower }} {{ p.agent.payment_info|default:''|lower }}">
  <input type="checkbox" name="pair" value="{{ p.agent.id }}:{{ p.agency.id }}"{% if checked %} checked{% endif %}>
  <span>
    <a class="al-link" href="{% url 'admin_travel_agent_detail' p.agent.id %}" onclick="event.stopPropagation();">{{ p.agent.agent_name|default:p.agent.user.username }}</a>
    {% if p.typed %}<span class="al-typed">Typed: {{ p.typed }}</span>{% endif %}
    {% if p.note %}<span class="al-note">{{ p.note }}</span>{% endif %}
  </span>
  {% include 'dispatching/_agency_link_chose.html' with agent=p.agent %}
  <span class="al-amount{% if not p.owed %} zero{% endif %}">${{ p.owed|floatformat:2|intcomma }}</span>
</label>
