databases:
  - name: businessdb
    plan: free
    databaseName: business
    user: business

services:
  - type: web
    plan: free
    name: business
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn business.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: businessdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DJANGO_SETTINGS_MODULE
        value: business.settings