<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

<!-- Driver Notes Modal -->
<div class="modal fade" id="driverNotesModal" tabindex="-1" aria-labelledby="driverNotesModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border:none;border-radius:var(--gt-radius);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);">
      <div class="modal-header" style="background:var(--gt-dark);border:none;padding:16px 20px;">
        <h5 class="modal-title" id="driverNotesModalLabel" style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:1rem;color:#fff;">
          <i class="bi bi-pencil-square me-2" style="opacity:0.6;"></i>Edit My Notes
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" style="padding:20px;">
        <textarea class="form-control" id="driver-notes-textarea-modal" rows="4"
                  placeholder="Add your notes about this trip..."
                  style="font-family:'DM Sans',sans-serif;border-radius:var(--gt-radius-sm);border:1.5px solid var(--gt-border);font-size:0.9375rem;resize:vertical;"></textarea>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--gt-border-light);padding:12px 20px;">
        <button type="button" class="gt-btn gt-btn-outline gt-btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="gt-btn gt-btn-primary gt-btn-sm" id="save-driver-notes-modal">
          <i class="bi bi-check2"></i> Save Notes
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Prevent browser from restoring scroll position on reload
    if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
    }

    const csrfToken = "{{ csrf_token }}";
    let currentLegId = null;

    // ── Toast helper ──
    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'var(--gt-green)'
                      : type === 'danger' ? 'var(--gt-red)'
                      : 'var(--gt-dark)';
        toast.style.cssText = `background:${bgColor};color:#fff;padding:12px 18px;border-radius:var(--gt-radius-sm);box-shadow:var(--gt-shadow-md);font-family:'DM Sans',sans-serif;font-size:0.875rem;font-weight:500;margin-top:8px;display:flex;align-items:center;gap:8px;animation:gt-toast-in 0.25s ease;`;
        toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:rgba(255,255,255,0.7);cursor:pointer;padding:0 0 0 8px;font-size:1.1rem;">&times;</button>`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(20px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // Add toast animation
    if (!document.getElementById('gt-toast-style')) {
        const style = document.createElement('style');
        style.id = 'gt-toast-style';
        style.textContent = '@keyframes gt-toast-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}';
        document.head.appendChild(style);
    }

    // ── Maps navigation helper (always Google Maps) ──
    window.getNavUrl = function(address) {
        return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(address);
    };

    // Wire up all navigate buttons (use anchor click to avoid iOS Safari blank page)
    document.querySelectorAll('.navigate-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const address = btn.dataset.address;
            if (!address) return;
            const a = document.createElement('a');
            a.href = getNavUrl(address);
            a.target = '_blank';
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
        });
    });

    // ── Flight status badge coloring ──
    function setFlightStatusBadge(badge, statusText) {
        if (!badge) return;
        const status = (statusText || '').toLowerCase();
        badge.classList.remove('bg-secondary','bg-danger','bg-success','bg-warning','bg-info','bg-primary');

        if (status.includes('cancel') || status.includes('canceled') || status.includes('delayed') || status.includes('divert')) {
            badge.classList.add('bg-danger');
        } else if (status.includes('arrived') || status.includes('arrival') || status.includes('landed') || status.includes('completed')) {
            badge.classList.add('bg-success');
        } else if (status.includes('en route') || status.includes('airborne') || status.includes('in air') || status.includes('departed')) {
            badge.classList.add('bg-success');
        } else if (status.includes('boarding') || status.includes('gate') || status.includes('taxi')) {
            badge.classList.add('bg-warning');
        } else if (status.includes('scheduled') || status.includes('on time') || status.includes('on-time') || status.includes('active')) {
            badge.classList.add('bg-primary');
        } else {
            badge.classList.add('bg-secondary');
        }
    }

    document.querySelectorAll('.flight-status').forEach(badge => {
        setFlightStatusBadge(badge, badge.dataset.flightStatus || badge.textContent);
    });

    // ── Status update helper ──
    function sendStatusUpdate(legId, newStatus, extraData = {}) {
        return fetch(`${window.location.origin}/drivers/update_leg_status/${legId}/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ status: newStatus, ...extraData })
        }).then(res => {
            if (!res.ok) throw new Error('Server error ' + res.status);
            return res.json();
        });
    }

    // ── Status select change handler ──
    document.querySelectorAll('.status-select:not([disabled])').forEach(select => {
        select.addEventListener('change', (event) => {
            const legId = event.target.id.replace('statusSelect-', '').replace('statusSelectMobile-', '');
            const newStatus = event.target.value;

            sendStatusUpdate(legId, newStatus)
            .then(data => {
                if (data.success) {
                    showToast(`Status updated to ${newStatus.replace(/-/g, ' ')}`, 'success');
                    setTimeout(() => { window.scrollTo(0,0); window.location.reload(); }, 600);
                } else {
                    showToast('Error: ' + (data.error || 'Unknown error'), 'danger');
                    setTimeout(() => window.location.reload(), 1000);
                }
            })
            .catch(() => {
                showToast('Error updating status', 'danger');
                setTimeout(() => window.location.reload(), 1000);
            });
        });
    });

    // ── Progression button handler ──
    document.querySelectorAll('.progression-btn').forEach(button => {
        button.addEventListener('click', (event) => {
            const btn = event.currentTarget;
            const legId = btn.dataset.legId;
            const nextStatus = btn.dataset.nextStatus;

            if (nextStatus === 'completed') {
                if (!confirm('Are you sure you want to mark this trip as completed?')) return;
            }

            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Updating...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            // Failsafe: if anything hangs, force reload after 10s
            const failsafe = setTimeout(() => { window.scrollTo(0,0); window.location.reload(); }, 10000);

            sendStatusUpdate(legId, nextStatus)
            .then(data => {
                clearTimeout(failsafe);
                if (data.success) {
                    showToast(`Status updated to ${nextStatus.replace(/-/g, ' ')}`, 'success');
                    setTimeout(() => { window.scrollTo(0,0); window.location.reload(); }, 600);
                } else {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    showToast('Error: ' + (data.error || 'Unknown error'), 'danger');
                }
            })
            .catch(error => {
                clearTimeout(failsafe);
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                btn.style.opacity = '1';
                showToast('Error updating status. Please try again.', 'danger');
            });
        });
    });

    // ── Auto-refresh: poll for schedule changes ──
    // Pages that want it set window.GT_BOARD_POLL = { start: 'Y-m-d', end: 'Y-m-d' }
    // before including this file. We poll a lightweight fingerprint endpoint and
    // reload when the driver's board changed (reassignment, retime, new/removed
    // trip), so an open tab never shows a stale schedule.
    const pollCfg = window.GT_BOARD_POLL;
    if (pollCfg) {
        const POLL_INTERVAL_MS = 60 * 1000;
        let boardFp = null;
        let reloadPending = false;

        function checkBoard() {
            if (reloadPending || document.visibilityState !== 'visible') return;
            const params = new URLSearchParams({ start: pollCfg.start, end: pollCfg.end });
            fetch("{% url 'driver_board_state' %}?" + params.toString(), {
                headers: { 'Accept': 'application/json' }
            })
            .then(res => res.ok ? res.json() : null)
            .then(data => {
                if (!data || !data.fp) return;
                if (boardFp === null) { boardFp = data.fp; return; }
                if (data.fp === boardFp) return;
                // Don't yank the page out from under an open modal — retry next tick
                if (document.querySelector('.modal.show')) return;
                reloadPending = true;
                showToast('Your schedule was updated — refreshing…', 'success');
                setTimeout(() => { window.scrollTo(0, 0); window.location.reload(); }, 1200);
            })
            .catch(() => {});
        }

        checkBoard(); // capture the baseline fingerprint right away
        setInterval(checkBoard, POLL_INTERVAL_MS);
        // Reopening the phone/tab is the moment a driver most needs fresh data
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkBoard();
        });
    }

    // ── Accept job handler ──
    document.querySelectorAll('.accept-job-btn').forEach(button => {
        button.addEventListener('click', (event) => {
            const btn = event.target.closest('.accept-job-btn');
            const legId = btn.dataset.legId;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Accepting...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            fetch(`${window.location.origin}/drivers/accept_job/${legId}/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.querySelectorAll(`.accept-job-btn[data-leg-id="${legId}"]`).forEach(b => b.style.display = 'none');
                    document.querySelectorAll(`[id$="statusSelect-${legId}"], [id$="statusSelectMobile-${legId}"]`).forEach(s => s.value = 'confirmed');
                    showToast('Job accepted!', 'success');
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    showToast('Error: ' + (data.error || 'Unknown error'), 'danger');
                }
            })
            .catch(error => {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                btn.style.opacity = '1';
                showToast('Error accepting job. Please try again.', 'danger');
            });
        });
    });

    // ── Flight data refresh ──
    function updateFlightUI(legId, flightData) {
        document.querySelectorAll(`.flight-tracker[data-leg-id="${legId}"]`).forEach(container => {
            const statusEl = container.querySelector('.flight-status');
            const landingEl = container.querySelector('.flight-landing');
            const gateArrivalEl = container.querySelector('.flight-gate-arrival');
            const updatedEl = container.querySelector('.flight-updated');

            if (statusEl) {
                statusEl.textContent = flightData.status || 'Unknown';
                setFlightStatusBadge(statusEl, flightData.status || '');
            }
            if (landingEl) {
                const val = flightData.actual_arrival_local || flightData.estimated_arrival_local || flightData.scheduled_arrival_local;
                if (val) {
                    landingEl.textContent = `Landing: ${val.split(' ').slice(1).join(' ')}`;
                    landingEl.style.display = '';
                } else {
                    landingEl.style.display = 'none';
                }
            }
            if (gateArrivalEl) {
                const val = flightData.actual_gate_arrival_local || flightData.estimated_gate_arrival_local || flightData.scheduled_gate_arrival_local;
                if (val) {
                    gateArrivalEl.textContent = `Gate: ${val.split(' ').slice(1).join(' ')}`;
                    gateArrivalEl.style.display = '';
                } else {
                    gateArrivalEl.style.display = 'none';
                }
            }
            if (updatedEl) {
                if (flightData.last_updated) {
                    updatedEl.textContent = `Updated ${flightData.last_updated.split(' ').slice(1).join(' ')}`;
                    updatedEl.style.display = '';
                } else {
                    updatedEl.style.display = 'none';
                }
            }
        });
    }

    document.querySelectorAll('.refresh-flight-data').forEach(button => {
        button.addEventListener('click', () => {
            const legId = button.getAttribute('data-leg-id');
            if (!legId) return;
            button.disabled = true;
            const origHtml = button.innerHTML;
            button.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';
            fetch("{% url 'driver_refresh_flight_data' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ leg_id: legId })
            })
            .then(response => response.json().then(data => ({ response, data })))
            .then(({ response, data }) => {
                if (data.success && data.flight_data) {
                    updateFlightUI(legId, data.flight_data);
                    showToast('Flight data refreshed', 'success');
                } else if (!response.ok && data.error) {
                    showToast(data.error, 'danger');
                }
            })
            .catch(err => {
                showToast('Could not refresh flight. Please try again.', 'danger');
            })
            .finally(() => {
                button.disabled = false;
                button.innerHTML = origHtml;
            });
        });
    });

    // ── Drive time refresh ──
    document.querySelectorAll('.gt-drive-refresh').forEach(btn => {
        btn.addEventListener('click', () => {
            const container = btn.closest('.gt-drive-estimate');
            const legId = container.getAttribute('data-leg-id');
            if (!legId) return;
            btn.classList.add('spinning');
            btn.disabled = true;
            fetch("{% url 'refresh_drive_time' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ leg_id: legId })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    container.querySelector('.gt-drive-time').textContent = data.duration_text;
                    container.querySelector('.gt-drive-distance').textContent = data.distance_text;
                    showToast('Drive time updated', 'success');
                } else {
                    showToast(data.error || 'Could not refresh', 'danger');
                }
            })
            .catch(() => showToast('Could not refresh drive time', 'danger'))
            .finally(() => {
                btn.classList.remove('spinning');
                btn.disabled = false;
            });
        });
    });

    // ── Driver notes modal ──
    function openNotesModal(legId, currentNotes) {
        currentLegId = legId;
        const textarea = document.getElementById('driver-notes-textarea-modal');
        const displayDiv = document.getElementById(`driver-notes-display-${legId}`);
        let latestNotes = currentNotes || '';

        if (displayDiv) {
            const noteContent = displayDiv.querySelector('.gt-note-driver');
            if (noteContent) latestNotes = noteContent.textContent.trim();
        }

        textarea.value = latestNotes;
        const modal = new bootstrap.Modal(document.getElementById('driverNotesModal'));
        modal.show();
    }

    function saveNotes() {
        if (!currentLegId) return;
        const textarea = document.getElementById('driver-notes-textarea-modal');
        const notes = textarea.value;
        const saveButton = document.getElementById('save-driver-notes-modal');
        const originalText = saveButton.innerHTML;
        saveButton.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';
        saveButton.disabled = true;

        fetch(`${window.location.origin}/drivers/update_driver_notes/${currentLegId}/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ driver_notes: notes })
        })
        .then(res => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
        })
        .then(data => {
            if (data.success) {
                document.querySelectorAll(`[id="driver-notes-display-${currentLegId}"]`).forEach(div => {
                    div.innerHTML = notes.trim()
                        ? `<div class="gt-note gt-note-driver">${notes}</div>`
                        : '';
                });

                const editButton = document.querySelector(`.edit-driver-notes[data-leg-id="${currentLegId}"]`);
                if (editButton) editButton.dataset.currentNotes = notes;

                const modal = bootstrap.Modal.getInstance(document.getElementById('driverNotesModal'));
                modal.hide();
                saveButton.innerHTML = originalText;
                saveButton.disabled = false;

                showToast('Notes saved', 'success');
            } else {
                throw new Error(data.error || 'Failed to save notes');
            }
        })
        .catch(error => {
            saveButton.innerHTML = originalText;
            saveButton.disabled = false;
            showToast('Error saving notes', 'danger');
        });
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('.edit-driver-notes')) {
            e.preventDefault();
            const button = e.target.closest('.edit-driver-notes');
            openNotesModal(button.dataset.legId, button.dataset.currentNotes || '');
        }
    });

    document.getElementById('save-driver-notes-modal').addEventListener('click', saveNotes);

    // ── Dark mode toggle ──
    function updateThemeIcons(theme) {
        var iconClass = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
        ['gt-theme-icon', 'gt-theme-icon-mobile'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.className = iconClass;
        });
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#111318' : '#1a1d21');
    }

    function toggleTheme() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        document.documentElement.style.backgroundColor = '';
        document.documentElement.style.colorScheme = next;
        localStorage.setItem('gt-theme', next);
        updateThemeIcons(next);
    }

    // Set icons on load
    updateThemeIcons(document.documentElement.getAttribute('data-theme') || 'light');

    // Bind both toggle buttons
    ['gt-theme-toggle', 'gt-theme-toggle-mobile'].forEach(function(id) {
        var btn = document.getElementById(id);
        if (btn) btn.addEventListener('click', toggleTheme);
    });

    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/drivers/sw.js', { scope: '/drivers/' })
            .catch(err => console.warn('SW registration failed:', err));
    }

    // ── Web Push notifications (bell in the navbar) ──
    const PUSH_KEY = "{{ WEBPUSH_VAPID_PUBLIC_KEY }}";
    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    const pushButtons = ['gt-push-toggle', 'gt-push-toggle-mobile']
        .map(id => document.getElementById(id)).filter(Boolean);

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const raw = window.atob(base64);
        return Uint8Array.from([...raw].map(ch => ch.charCodeAt(0)));
    }

    function setPushIcons(state) { // 'on' | 'off' | 'blocked'
        const cls = state === 'on' ? 'bi bi-bell-fill'
                  : state === 'blocked' ? 'bi bi-bell-slash'
                  : 'bi bi-bell';
        ['gt-push-icon', 'gt-push-icon-mobile'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.className = cls;
        });
    }

    async function refreshPushUI() {
        if (!pushButtons.length || !PUSH_KEY) return;
        if (!pushSupported) {
            // iOS Safari tab: push only works once installed — show the bell so
            // tapping it explains Add to Home Screen. Other browsers: hide.
            if (IS_IOS && !IS_STANDALONE) {
                pushButtons.forEach(b => b.classList.remove('d-none'));
                setPushIcons('off');
            }
            return;
        }
        pushButtons.forEach(b => b.classList.remove('d-none'));
        if (Notification.permission === 'denied') { setPushIcons('blocked'); return; }
        try {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.getSubscription();
            setPushIcons(sub ? 'on' : 'off');
        } catch (e) { setPushIcons('off'); }
    }

    async function togglePush() {
        if (!pushSupported) {
            if (IS_IOS && !IS_STANDALONE) {
                showToast('To get notifications: tap Share <i class="bi bi-box-arrow-up"></i>, then "Add to Home Screen", then open the app from your home screen.', 'dark');
            } else {
                showToast('Notifications are not supported in this browser', 'danger');
            }
            return;
        }
        if (Notification.permission === 'denied') {
            showToast('Notifications are blocked — allow them for this site in your phone settings.', 'danger');
            return;
        }
        try {
            const reg = await navigator.serviceWorker.ready;
            const existing = await reg.pushManager.getSubscription();

            if (existing) {
                await fetch("{% url 'driver_push_unsubscribe' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ endpoint: existing.endpoint })
                }).catch(() => {});
                await existing.unsubscribe().catch(() => {});
                setPushIcons('off');
                showToast('Trip notifications turned off', 'dark');
                return;
            }

            const perm = await Notification.requestPermission();
            if (perm !== 'granted') { setPushIcons(perm === 'denied' ? 'blocked' : 'off'); return; }

            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(PUSH_KEY),
            });
            const resp = await fetch("{% url 'driver_push_subscribe' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ subscription: sub.toJSON() })
            });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error || 'subscribe failed');
            setPushIcons('on');
            // Server sends a test notification so the driver sees it working
            fetch("{% url 'driver_push_test' %}", {
                method: 'POST', headers: { 'X-CSRFToken': csrfToken }
            }).catch(() => {});
        } catch (err) {
            console.error('Push subscribe failed:', err);
            const msg = (err && err.message) ? err.message : 'unknown error';
            showToast('Could not enable notifications: ' + msg, 'danger');
            setPushIcons('off');
        }
    }

    pushButtons.forEach(b => b.addEventListener('click', togglePush));
    refreshPushUI();

    // ── Add-to-Home-Screen nudge (dismissible, once) ──
    (function () {
        if (IS_STANDALONE) return;
        if (localStorage.getItem('gt-install-dismissed') === '1') return;
        let deferredPrompt = null;

        function showInstallBanner(mode) { // 'android' | 'ios'
            if (document.getElementById('gt-install-banner')) return;
            const div = document.createElement('div');
            div.id = 'gt-install-banner';
            div.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;z-index:1050;background:var(--gt-dark);color:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,0.35);display:flex;align-items:center;gap:12px;font-family:\'DM Sans\',sans-serif;';
            const text = mode === 'ios'
                ? '<div style="flex:1;font-size:0.875rem;">Install the app: tap <i class="bi bi-box-arrow-up"></i> <strong>Share</strong>, then <strong>Add to Home Screen</strong></div>'
                : '<div style="flex:1;font-size:0.875rem;">Install the GT Driver app for one-tap access and trip notifications</div>';
            div.innerHTML = '<i class="bi bi-phone" style="font-size:1.25rem;"></i>' + text +
                (mode === 'android' ? '<button id="gt-install-btn" style="background:#fff;color:#1a1d21;border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:0.8125rem;white-space:nowrap;">Install</button>' : '') +
                '<button id="gt-install-dismiss" style="background:none;border:none;color:rgba(255,255,255,0.6);font-size:1.25rem;padding:0 4px;" aria-label="Dismiss">&times;</button>';
            document.body.appendChild(div);
            document.getElementById('gt-install-dismiss').addEventListener('click', () => {
                div.remove();
                localStorage.setItem('gt-install-dismissed', '1');
            });
            const btn = document.getElementById('gt-install-btn');
            if (btn) btn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                await deferredPrompt.userChoice.catch(() => {});
                div.remove();
                localStorage.setItem('gt-install-dismissed', '1');
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallBanner('android');
        });
        if (IS_IOS) showInstallBanner('ios');
    })();
});
</script>
