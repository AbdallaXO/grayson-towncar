{# Sitewide sticky call/text/back-to-top buttons. Self-contained (own classes, CSS, JS) so it works on any public page. The home page overrides the sticky_contact block with its own set, so this never double-renders there. #}
<div class="gt-sticky-contact" aria-label="Contact Grayson Towncar">
  <a href="tel:+14072127190" class="gt-sticky-btn gt-sticky-call" title="Call Now" aria-label="Call 407-212-7190">
    <i class="fas fa-phone"></i>
  </a>
  <a href="sms:+14072127190" class="gt-sticky-btn gt-sticky-text" title="Text Now" aria-label="Text 407-212-7190">
    <i class="fas fa-sms"></i>
  </a>
  <button type="button" class="gt-sticky-btn gt-sticky-scroll" id="gtScrollTop" title="Back to Top" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>
</div>

<style>
  .gt-sticky-contact {
    position: fixed; right: 20px; bottom: 20px; z-index: 1040;
    display: flex; flex-direction: column; gap: 12px;
  }
  .gt-sticky-btn {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; border: none; cursor: pointer; text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .gt-sticky-call { background: #C9A227; color: #16120A; }
  .gt-sticky-call:hover { background: #E8D5B7; color: #16120A; transform: scale(1.08); }
  .gt-sticky-text { background: #1A1A2E; color: #fff; }
  .gt-sticky-text:hover { background: #2c2c4a; color: #fff; transform: scale(1.08); }
  .gt-sticky-scroll { background: rgba(26,26,46,0.75); color: #fff; display: none; }
  .gt-sticky-scroll:hover { background: #1A1A2E; transform: scale(1.08); }
  @media (max-width: 575.98px) {
    .gt-sticky-contact { right: 14px; bottom: 14px; gap: 10px; }
    .gt-sticky-btn { width: 48px; height: 48px; font-size: 16px; }
  }
</style>

<script>
  (function () {
    var btn = document.getElementById('gtScrollTop');
    if (!btn) return;
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    window.addEventListener('scroll', function () {
      btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
    });
  })();
</script>
