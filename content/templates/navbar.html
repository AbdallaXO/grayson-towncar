              <li>

              </li>

        <li class="nav-item">
          <a class="nav-link text-white" href="{% url 'rates' %}">Bookings</a>

<style>
    /* Increase the size of navbar items */
    .navbar-nav .nav-link {
        font-size: 1.2rem;
        /* Increase font size */
        padding: 0.8rem 1rem;
        /* Increase padding */
    }

    /* Adjust the size of the navbar dropdown */
    .navbar-nav .nav-item.dropdown .dropdown-toggle {
        font-size: 1.2rem;
        /* Larger font for dropdown items */
        padding: 0.8rem 1rem;
        /* Larger padding for dropdown items */
    }

    /* Increase the size of dropdown items */
    .dropdown-menu .dropdown-item {
        font-size: 1.1rem;
        /* Larger font for dropdown items */
        padding: 0.75rem 1rem;
        /* Increase padding for dropdown items */
    }

    /* Adjust navbar toggler (hamburger icon) size */
    .navbar-toggler {
        padding: 1rem;
        /* Increase size of the hamburger icon */
    }

    /* Adjust the navbar brand (logo) size */
    .navbar-brand img {
        height: 150px;
        /* Adjust logo size */
        width: auto;
    }
</style>
