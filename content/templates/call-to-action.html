{% load static %}
<section class="bg-warning bg-opacity-10 py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-6 pe-lg-5">
                    <div class="mb-4">
                        <h2 class="display-6 fw-bold mb-3 text-start">Ready to Book With Us?</h2>
                        <p class="text-muted lead mb-4">

                        </p>
                        <div class="d-flex align-items-center mb-4">
                            <div class="bg-warning bg-opacity-50 rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px;">

                <div class="col-lg-6 d-none d-lg-block">
