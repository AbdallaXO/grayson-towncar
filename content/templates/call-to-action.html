<section class="py-5" id="booking">
    <div class="container px-5 my-5">
        <div class="row gx-5 align-items-center">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <h2 class="fw-bolder mb-3">Ready to Book Your Orlando Hotel Transportation?</h2>
                <p class="lead mb-4">
                    Experience the Grayson Towncar difference for your Orlando airport to hotel transportation. Book now to secure your private vehicle.
                </p>
                <div class="mb-4">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-telephone-fill me-2 text-primary"></i>
                        <span class="fw-bold">Call 24/7 for quotes and reservations:</span>
                    </div>
                    <div class="h4 mb-0 fw-bold">555-123-4567</div>
                </div>
                <a href="#" class="btn btn-primary btn-lg px-4 mb-2 me-sm-3">Book Online Now</a>
                <a href="#" class="btn btn-outline-dark btn-lg px-4 mb-2">Email Quote Request</a>
            </div>
            <div class="col-lg-6">
                <div class="card border-0 shadow">
                    <div class="card-body p-4">
                        <h3 class="h5 fw-bolder mb-4">Get a Quick Quote</h3>
                        <form>
                            <div class="mb-3">
                                <label class="form-label small text-muted" for="serviceType">Transportation Type</label>
                                <select class="form-select" id="serviceType" required>
                                    <option value="" selected disabled>Select service...</option>
                                    <option value="airport-hotel">Airport to Hotel</option>
                                    <option value="hotel-airport">Hotel to Airport</option>
                                    <option value="hotel-hotel">Point to Point</option>
                                    <option value="hotel-port">Hotel to Port Canaveral</option>
                                    <option value="mco-port">Airport to Port Canaveral</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="pickup-location">Pickup Location</label>
                                    <input class="form-control" id="pickup-location" type="text" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="dropoff-location">Dropoff Location</label>
                                    <input class="form-control" id="dropoff-location" type="text" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="dateService">Date</label>
                                    <input class="form-control" id="dateService" type="date" />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="passengers">Passengers Count</label>
                                    <input class="form-control" id="passengers" type="number" min="1" max="14" />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="passengers">Email</label>
                                    <input class="form-control" id="passengers" type="text" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small text-muted" for="requests">Special Requests?</label>
                                    <input class="form-control" id="requests" type="text" />
                                </div>
                            </div>
                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit">Request Quote</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
