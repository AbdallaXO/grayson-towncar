<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Grayson Towncar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8f9fa;
            color: #343a40;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container { max-width: 400px; }
        .icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { color: #6c757d; margin-bottom: 20px; }
        button {
            background: #343a40;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:active { background: #495057; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128246;</div>
        <h1>You're Offline</h1>
        <p>Check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
