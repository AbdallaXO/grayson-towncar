{% extends "main.html" %}
{% load static %}

{% block content %}
  <div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="bg-white shadow-lg rounded-2xl p-10 text-center max-w-md w-full">
      <div class="flex justify-center mb-6">
        <svg class="w-16 h-16 text-green-500"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-gray-800 mb-2">Payment Successful</h1>
      <p class="text-gray-600 mb-6">
        Thank you for booking with <span class="font-semibold text-gray-800">Grayson Towncar</span>.
        <br>
        Your reservation has been confirmed.
      </p>
      <a href="{% url 'home' %}"
         class="inline-block bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg transition">
        Return to Homepage
      </a>
    </div>
  </div>
{% endblock %}
