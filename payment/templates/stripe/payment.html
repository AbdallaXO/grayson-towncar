<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Choose Payment Option</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
  </head>
  <body class="bg-light py-5">
    <div class="container">
      <div class="card shadow mx-auto" style="max-width: 500px;">
        <div class="card-body text-center">
          <h1 class="card-title mb-3">Reservation #{{ reservation.id }}</h1>
          <p class="card-text fs-5">
            Total: <strong>${{ reservation.total_price }}</strong>
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-3 mt-4">
              <button type="submit"
                      name="action"
                      value="pay_now"
                      class="btn btn-primary btn-lg">💳 Pay Now</button>
              <button type="submit"
                      name="action"
                      value="save_card"
                      class="btn btn-outline-secondary btn-lg">🔐 Save Card, Pay Later</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Optional Bootstrap JS (for interactive components, not required here) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
