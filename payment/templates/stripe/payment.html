<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Choose Payment Option</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="card border-0 shadow-lg" style="width: 500px;">
        <div class="card-body p-4 text-center">
          <div class="mb-4">
            <h1 class="h3 mb-2 fw-bold">Reservation #1</h1>
            <h2 class="h5 text-muted">John Doe</h2>
            <h3 class="h6 text-muted">Reservation Details</h3>
          </div>

          <div class="bg-white border rounded-3 p-3 mb-4">
            <div class="row g-3">
              <div class="col-6">
                <div class="small text-muted">Date</div>
                <div class="fw-semibold">04/07/2025</div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Route Type</div>
                <div class="fw-semibold text-break">Orlando International Airport ⇄ Disney Springs Hotels</div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Vehicle Type</div>
                <div class="fw-semibold">Mini Van</div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Passengers</div>
                <div class="fw-semibold">3</div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Luggage</div>
                <div class="fw-semibold">3</div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Child Seats</div>
                <div class="fw-semibold">1</div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <div class="h4 mb-0">Total: <strong class="text-primary">$85.00</strong></div>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-3">
              <button type="submit"
                      name="action"
                      value="pay_now"
                      class="btn btn-primary btn-lg">💳 Pay Now</button>
              <button type="submit"
                      name="action"
                      value="save_card"
                      class="btn btn-outline-secondary btn-lg">🔐 Save Card, Pay Later</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Optional Bootstrap JS (for interactive components, not required here) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
